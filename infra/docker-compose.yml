services:
  ai-server:
    image: ghcr.io/monancho/ocl-ai-server:0.1.0
    restart: unless-stopped
    env_file:
      - path: ./env/ai-server.env
        required: false
    expose:
      - "8000"

  api:
    image: ${API_IMAGE:-ghcr.io/monancho/proj01-quiz-widget-api:develop}
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/api.env.example
      - path: ./env/api.env
        required: false
    volumes:
      - quiz-data:/data
    expose:
      - "3000"
    depends_on:
      - ai-server
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  quiz-data:
  caddy-data:
  caddy-config:
